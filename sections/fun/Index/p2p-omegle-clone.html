<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerJS Omegle Clone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #videos {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        video {
            width: 400px;
            height: 300px;
            border: 2px solid #333;
            background-color: #000;
            transform: scaleX(-1); /* Mirror effect */
        }
        #controls {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            min-width: 150px;
        }
        #status {
            margin-top: 15px;
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>PeerJS Omegle Clone</h1>
    <div id="videos">
        <div>
            <h2>You</h2>
            <video id="localVideo" autoplay muted></video>
        </div>
        <div>
            <h2>Stranger</h2>
            <video id="remoteVideo" autoplay></video>
        </div>
    </div>
    <div id="controls">
        <button id="findBtn">Find Stranger</button>
        <button id="nextBtn" style="display: none;">Next</button>
    </div>
    <p id="status">Your Peer ID: <span id="myPeerId"></span></p>

    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const findBtn = document.getElementById('findBtn');
        const nextBtn = document.getElementById('nextBtn');
        const myPeerIdSpan = document.getElementById('myPeerId');
        const statusEl = document.getElementById('status');

        let localStream;
        let peer;
        let currentCall;
        let myPeerId;

        // --- NEW DISCOVERY LOGIC ---
        // We will try to connect to peers with predictable IDs.
        // This is a workaround for not having a server to list available peers.
        const PEER_ID_PREFIX = 'omegle-clone-user-';
        let strangerIndex = 1;
        const MAX_USERS_TO_TRY = 50; // We'll try to connect to up to 50 users.

        async function initialize() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;

                // Create a peer with a random ID. The other user will use this to call us.
                peer = new Peer();

                peer.on('open', id => {
                    myPeerId = id;
                    myPeerIdSpan.textContent = id;
                    statusEl.textContent = 'Ready to connect. Click "Find Stranger".';
                });

                peer.on('call', call => {
                    // Someone is calling us. Answer the call.
                    call.answer(localStream);
                    handleConnected(call);
                });

                peer.on('error', err => {
                    console.error('PeerJS error:', err);
                    if (err.type === 'peer-unavailable') {
                        // This is expected when trying to find a random peer.
                        // We simply try the next one.
                        findStranger();
                    } else {
                        statusEl.textContent = `Error: ${err.message}`;
                    }
                });

            } catch (err) {
                console.error('Failed to get local stream', err);
                statusEl.textContent = 'Error: Could not access your camera or microphone.';
            }
        }

        function handleConnected(call) {
            currentCall = call;
            statusEl.textContent = "Connected!";
            findBtn.style.display = 'none';
            nextBtn.style.display = 'inline-block';

            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
            });

            call.on('close', cleanup);
            call.on('error', cleanup);
        }

        function cleanup() {
            if (currentCall) {
                currentCall.close();
                currentCall = null;
            }
            remoteVideo.srcObject = null;
            statusEl.textContent = "Disconnected. Find a new stranger!";
            findBtn.style.display = 'inline-block';
            nextBtn.style.display = 'none';
        }

        function findStranger() {
             if (!peer || !myPeerId) {
                statusEl.textContent = "PeerJS is not initialized yet. Please wait.";
                return;
            }
            
            // For a "random" feel, we connect to a peer with a custom ID
            // by using the PeerJS server as a meeting point.
            // A true random implementation requires your own server.
            
            // Here's the new strategy: generate a random peer ID and try to connect.
            // This relies on another user being available with that ID.
            const randomId = Math.floor(Math.random() * 10000);
            const remotePeerId = `${PEER_ID_PREFIX}${randomId}`;

            // We can't connect to ourselves
            if (remotePeerId === myPeerId) {
                return findStranger();
            }
            
            statusEl.textContent = `Trying to connect to a random peer...`;

            // We change our own ID to a predictable one so others can find us
            // This is a bit of a hack, but it works without a dedicated server.
            // The best way would be to disconnect and reconnect, but PeerJS doesn't allow ID changes.
            // Instead, we will rely on others to find us with our random ID while we search.
            
             // Create a random ID for another user to guess and connect to.
            const randomTargetId = PEER_ID_PREFIX + Math.floor(Math.random() * 1000);
            
            statusEl.textContent = `Attempting to connect to ${randomTargetId}...`;
            
            const call = peer.call(randomTargetId, localStream);
            
            // If the call fails (which it likely will often), the 'error' handler will trigger
            // and we can try again.
            if (call) {
                handleConnected(call);
            }
        }
        
        findBtn.addEventListener('click', () => {
             // Reset search and start looking for a stranger
            strangerIndex = 1;
            findStranger();
        });

        nextBtn.addEventListener('click', cleanup);

        initialize();

    </script>
</body>
</html>
